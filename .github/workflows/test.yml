name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - pyproject.toml
      - src/data_agent_ctl/**/*.py
      - pylintrc
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: data-agent-ctl
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          bash dev/setup.sh --deps "development"
      - name: Vulture (dead code)
        run: |
          uv run vulture
      - name: Run tests
        run: |
          uv run bash dev/test_python.sh
      - name: Dagent CLI contract smoke checks
        run: |
          uv run data-agent-ctl validate --source dbt --manifest examples/dbt/manifest.json --project analytics-dev --location global
          uv run data-agent-ctl plan --source dbt --manifest examples/dbt/manifest.json --projects analytics-dev --location global --out target/data-agent-ctl.plan.json
          uv run data-agent-ctl drift detect --source dbt --manifest examples/dbt/manifest.json --projects analytics-dev --location global --format json
          uv run data-agent-ctl drift report --source dbt --manifest examples/dbt/manifest.json --projects analytics-dev --location global --format html --out reports/data-agent-ctl.html
      - name: Test build
        run: |
          uv run bash dev/build.sh
      # - name: Test installation
      #   run: |
      #     pip install -e .
      #     python -c 'import ${{ env.PYTHON_PACKAGE_NAME }}'
